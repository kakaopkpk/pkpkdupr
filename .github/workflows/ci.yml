name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe가 HEAD 조상의 태그를 찾도록 전체 history와 태그를 받는다.
          fetch-depth: 0

      - name: Resolve app version
        run: |
          APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0+$(git rev-parse --short=8 HEAD)")"
          echo "VITE_APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test api
        run: pnpm --filter @pkpkdupr/api test

      - name: Test shared
        run: pnpm --filter @pkpkdupr/shared test

      - name: Test web
        run: pnpm --filter @pkpkdupr/web test
