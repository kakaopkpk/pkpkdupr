name: pages

# web(루트)과 admin-web(admin/)을 한 GitHub Pages 사이트로 빌드·배포한다.
# 필요한 Pages 설정과 repo variables는 docs/deploy.md의 "GitHub Pages (web·admin)"을 따른다.
# 운영 배포는 GitHub Release를 발행할 때만 한다. 수동 실행은 고르는 브랜치·태그로 배포한다.
on:
  release:
    types:
      - published
  workflow_dispatch:

# 배포가 겹치면 마지막 실행만 남긴다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 프로젝트 Pages 주소 https://<owner>.github.io/<저장소 이름>/
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_FUNCTION_REGION: ${{ vars.VITE_FUNCTION_REGION }}

    steps:
      # release 이벤트면 릴리즈 태그 커밋을 체크아웃한다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 수동 실행에서 git describe가 HEAD 조상의 태그를 찾도록 전체 history와 태그를 받는다.
          fetch-depth: 0

      # 앱 버전은 릴리즈 태그 이름이다. 수동 실행이면 가장 가까운 조상 태그를 쓴다.
      - name: Resolve app version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          APP_VERSION="${RELEASE_TAG:-$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0+$(git rev-parse --short=8 HEAD)")}"
          echo "VITE_APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack pnpm
        run: |
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 필수 variable이 비어 있으면 assemble.sh가 빌드 전에 실패한다.
      - name: Build and assemble
        run: bash scripts/pages/assemble.sh "$RUNNER_TEMP/pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
